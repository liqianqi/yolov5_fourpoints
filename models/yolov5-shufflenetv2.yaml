# YOLOv5 四点检测 + ShuffleNetV2-0.5x 轻量级 backbone
# 面向 Jetson NX 等边缘设备部署, 参数量远小于 yolov5n
# Usage: python train.py --cfg models/yolov5-shufflenetv2.yaml --weights '' --data data/data12.yaml

nc: 12 # number of classes (2 colors x 6 stickers)
ncolor: 2 # dual-branch head: number of colors
depth_multiple: 1.0
width_multiple: 1.0
channel_multiple: 1 # 禁止 make_divisible 改变通道数

anchors:
  - [10, 13, 16, 30, 33, 23] # P3/8
  - [30, 61, 62, 45, 59, 119] # P4/16
  - [116, 90, 156, 198, 373, 326] # P5/32

# ShuffleNetV2-0.5x backbone (stage 通道 48/96/192)
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [24, 3, 2]], # 0-P1/2
    [-1, 1, nn.MaxPool2d, [3, 2, 1]], # 1-P2/4
    [-1, 1, ShuffleV2Block, [48, 2]], # 2-P3/8
    [-1, 3, ShuffleV2Block, [48, 1]], # 3
    [-1, 1, ShuffleV2Block, [96, 2]], # 4-P4/16
    [-1, 7, ShuffleV2Block, [96, 1]], # 5
    [-1, 1, ShuffleV2Block, [192, 2]], # 6-P5/32
    [-1, 3, ShuffleV2Block, [192, 1]], # 7
    [-1, 1, SPPF, [192, 5]], # 8
  ]

# 轻量化 PANet head
head: [
    [-1, 1, Conv, [96, 1, 1]], # 9
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 10
    [[-1, 5], 1, Concat, [1]], # 11 cat P4
    [-1, 1, C3, [96, False]], # 12

    [-1, 1, Conv, [48, 1, 1]], # 13
    [-1, 1, nn.Upsample, [None, 2, "nearest"]], # 14
    [[-1, 3], 1, Concat, [1]], # 15 cat P3
    [-1, 1, C3, [48, False]], # 16 (P3/8-small)

    [-1, 1, Conv, [48, 3, 2]], # 17
    [[-1, 13], 1, Concat, [1]], # 18 cat head P4
    [-1, 1, C3, [96, False]], # 19 (P4/16-medium)

    [-1, 1, Conv, [96, 3, 2]], # 20
    [[-1, 9], 1, Concat, [1]], # 21 cat head P5
    [-1, 1, C3, [128, False]], # 22 (P5/32-large)

    [[16, 19, 22], 1, Detect, [nc, anchors]], # Detect(P3, P4, P5)
  ]
